name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Install → Typecheck → Lint → Test → Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eventpilot
          POSTGRES_PASSWORD: eventpilot
          POSTGRES_DB: eventpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventpilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://eventpilot:eventpilot@localhost:5432/eventpilot_test
          REDIS_URL: redis://localhost:6379
          ANTHROPIC_API_KEY: sk-ant-ci-placeholder
          LLM_MODE: fixture
          NOTIFY_MODE: dry-run
          NODE_ENV: test

      - name: Build
        run: pnpm build
